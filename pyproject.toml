[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-rag-assistant"
version = "1.0.0"
description = "Kernel Knowledge Assistant - a transparent RAG workshop demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=3.0,<4",
    "chromadb>=1.5.9,<2",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.53,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
